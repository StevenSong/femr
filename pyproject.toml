[build-system]
requires = ["setuptools >= 69.0", "setuptools-scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "femr"
description = "Framework for Electronic Medical Records. A python package for building models using EHR data."
readme = "README.md"
dependencies = [
    "numpy >= 1.22",
    "scipy >= 1.6",
    "scikit-learn >= 0.24",
    "tqdm >= 4.60.0",
    "zstandard >= 0.18",
    "icecream == 2.1.3",
    "nptyping == 2.4.1",
    "msgpack >= 1.0.5",
    "meds == 0.1.3",
    "torch >= 2.1.2",
    "transformers >= 4.25",
    "datasets >= 2.15",
    "polars >= 0.20",
    "dill >= 0.3.7",
    "xformers",
    # triton 2.1 (pulled in by torch 2.1.2) imports setuptools at runtime, which uv venvs don't include
    "setuptools",
]
requires-python=">3.9"
dynamic = ["version"]

[tool.setuptools_scm]
version_file = "src/femr/_version.py"

[project.scripts]

femr_stanford_omop_fixer = "femr.post_etl_pipelines.stanford:femr_stanford_omop_fixer_program"

[project.optional-dependencies]
build = [
    "pytest >= 5.2",
    "flake8-future-import >= 0.4.6",
    "black >= 19.10b0",
    "isort >= 5.3.2",
    "mypy >= 0.782",
    "flake8 >= 3.8.3",
    "sphinx >= 3.2.1",
    "sphinx-rtd-theme >= 0.5.0",
    "sphinx-autoapi >= 1.5.1",
    "torchtyping == 0.1.4",
]

[dependency-groups]
dev = [
    "femr[build]",
    "ipykernel",
    "ipywidgets",
    "pre-commit",
]

[tool.uv]
# xformers has no macOS wheels, and torch 2.1.2 has no wheels past Python 3.11.
environments = ["sys_platform == 'linux' and python_version < '3.12'"]
# Reproduce the environment StanfordShahLab/clmbr-t-base was released with (see its model card).
constraint-dependencies = [
    "torch == 2.1.2",
    # The xformers build for torch 2.1.2; xformers only loads its CUDA extensions with the torch it was built against.
    "xformers == 0.0.23.post1",
    "transformers == 4.35.2",
    "datasets == 2.15.0",
    # torch 2.1.2 was built against NumPy 1.x.
    "numpy < 2",
    # datasets 2.15 relies on pyarrow APIs that later releases removed.
    "pyarrow < 15",
]

[tool.isort]
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 120

[tool.black]
line_length = 120
target_version = ['py310']

[tool.pydocstyle]
match = "src/.*\\.py"


[tool.pytest.ini_options]
pythonpath = [
    "tests"
]
